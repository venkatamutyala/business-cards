server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime map has no .webmanifest and would serve it as
    # application/octet-stream, which silently breaks PWA install.
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/manifest+json             webmanifest;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        text/vcard                            vcf;
    }
    default_type application/octet-stream;

    # Dev server: never cache, so a tunnel session always serves current files.
    add_header Cache-Control "no-store, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
